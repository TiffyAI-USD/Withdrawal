<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>TiffyAI Secure Transaction Gateway</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #050b14;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .gateway-card {
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid #00ffff;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.25);
            backdrop-filter: blur(10px);
        }
        h2 { color: #fff; text-shadow: 0 0 10px #00ffff; font-size: 18px; margin-top: 0; }
        p { font-size: 13px; color: #aeefff; line-height: 1.6; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 255, 255, 0.2);
            border-top: 3px solid #00ff00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .target-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed #00ffff;
            padding: 10px;
            border-radius: 10px;
            font-size: 12px;
            margin: 15px 0;
            word-break: break-all;
        }
        .manual-btn {
            background: rgba(0, 255, 0, 0.15);
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            font-size: 14px;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>

    <div class="gateway-card">
        <h2>🛡️ Secure Web3 Handshake</h2>
        <div class="spinner"></div>
        <p>Bypassing browser heuristic blocks and routing your delta consolidation safely through Render infrastructure...</p>
        
        <div class="target-box" id="routeDetails">
            Initializing secure payload tunnel...
        </div>

        <button class="manual-btn" id="manualRedirectBtn" style="display:none;">Click to Open App Manually</button>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const walletType = params.get('wallet');
            const amount = params.get('amount');
            const targetDapp = params.get('redirect') || window.location.origin + "/";

            const routeDetails = document.getElementById('routeDetails');
            const manualBtn = document.getElementById('manualRedirectBtn');

            if (!walletType || !amount) {
                routeDetails.innerHTML = `<span style="color:#ff3333;">Error: Missing routing parameters. Please restart from the main terminal.</span>`;
                return;
            }

            routeDetails.innerHTML = `<b>Target Wallet:</b> ${walletType.toUpperCase()}<br><b>Consolidation Delta:</b> ${amount} TUSD<br><b>Status:</b> Ready for dispatch`;

            // Construct safe deep-link destination URL
            const finalDappUrl = `${targetDapp}?wallet_auth=${walletType}&amt=${amount}&t=${Date.now()}`;
            
            let deepLink = "";
            switch(walletType.toLowerCase()) {
                case 'metamask':
                    deepLink = `https://metamask.app.link/dapp/${finalDappUrl.replace(/^https?:\/\//, '')}`;
                    break;
                case 'trust':
                    deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(finalDappUrl)}`;
                    break;
                case 'okx':
                    deepLink = `okx://wallet/dapp/details?dappUrl=${encodeURIComponent(finalDappUrl)}`;
                    break;
                default:
                    deepLink = finalDappUrl;
            }

            manualBtn.style.display = 'block';
            manualBtn.onclick = () => {
                window.location.href = deepLink;
            };

            // Automatic execution delay to ensure rendering completes smoothly on Render
            setTimeout(() => {
                window.location.href = deepLink;
            }, 800);
        });
    </script>
</body>
</html>
